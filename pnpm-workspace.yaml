  "@types/react": "^19.2.14"
  "@types/react-dom": "^19.2.3"
  "convex": "^1.34.1"
  "react": "^19.2.4"
  "react-dom": "^19.2.4"
  "typescript": "^5.9.3"
  "vite": "^8.0.3"
  "vitest": "^4.1.2"
