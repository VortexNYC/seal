                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone: { type: string, nullable: true }
                company: { type: string, nullable: true }
                title: { type: string, nullable: true }
                status: { $ref: "#/components/schemas/ContactStatus" }
                notes: { type: string, nullable: true }
                tags:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  # Folders
  # ──────────────────────────────────────────────────────────────────────────

  /folders:
    get:
      tags: [Folders]
      operationId: listFolders
      summary: List folders
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [document, template]
            default: document
        - name: parent_id
          in: query
          schema: { type: string }
          description: Parent folder public ID; omit for root folders
        - name: flat
          in: query
          schema: { type: boolean, default: false }
          description: When true, return all folders of the type (ignore parent)
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Folders]
      operationId: createFolder
      summary: Create a folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type:
                  type: string
                  enum: [document, template]
                  default: document
                parent_id: { type: string }
                visibility:
                  type: string
                  enum: [everyone, members, restricted]
                  default: everyone
                pinned: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Folder" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /folders/breadcrumbs:
    get:
      tags: [Folders]
      operationId: getFolderBreadcrumbs
      summary: Folder breadcrumbs
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
          description: Folder public ID
      responses:
        "200":
          description: Breadcrumb trail from root to the folder
          content:
            application/json:
              schema:
                type: object
                required: [breadcrumbs]
                properties:
                  breadcrumbs:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # ──────────────────────────────────────────────────────────────────────────
  # Reviews (ADR-006 / SEA-80)
  # ──────────────────────────────────────────────────────────────────────────

  /reviews:
    get:
      tags: [Reviews]
      operationId: listReviewMatrices
      summary: List review matrices (summary rows, no cell fan-out)
      responses:
        "200":
          description: Matrices
          content:
            application/json:
              schema:
                type: object
                properties:
                  matrices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status: { type: string }
                        row_count: { type: integer }
                        column_count: { type: integer }
                        created_at: { type: string, format: date-time }
                        updated_at: { type: string, format: date-time }
    post:
      tags: [Reviews]
      operationId: createReviewMatrix
      summary: Create a review matrix
      description: >
        Creates a matrix with one row per document and one pending cell per
        column. Cells are filled by the calling agent via
        `PATCH /reviews/{id}/cells` — Seal runs no inference; it grounds each
        submitted quote against the row document's stored text.
        Every `done` cell must carry ≥1 citation or the literal `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, documentIds]
              properties:
                title: { type: string, maxLength: 200 }
                pack_id:
                  type: string
                  description: >
                    Review pack to expand — `builtin/nda`, `builtin/msa`,
                    `builtin/employment`, or an org-authored `pack_*` id.
                    Explicit `columns` override pack defaults.
                columns:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: { $ref: "#/components/schemas/ReviewColumn" }
                documentIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                  description: Document public IDs in this organization
      responses:
        "201":
          description: Created matrix (cells pending)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewMatrix" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reviews/{id}:
    get:
      tags: [Reviews]
      operationId: getReviewMatrix
      summary: Get a review matrix
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Review matrix public ID
      responses:
        "200":
          description: Matrix with rows and cells
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewMatrix" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /reviews/{id}/cells:
    patch:
      tags: [Reviews]
      operationId: writeReviewCells
      summary: Write agent-authored cell results
      description: >
        The caller's own model reasons over each row's parsed document text
        and posts answers; Seal runs no inference for this route. Every
        `quote` is grounded server-side against the row document's stored
        text — a quote absent from the document collapses to `not_found`
        rather than anchoring invented text. The matrix flips to `ready`
        once all cells resolve. `model_used` records the caller's model
        label (e.g. `agent/claude-opus-4-6`) for provenance — it is a label,
        not a billed provider call.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cells]
              properties:
                model_used:
                  type: string
                  maxLength: 120
                cells:
                  type: array
                  minItems: 1
                  maxItems: 256
                  items:
                    type: object
                    required: [summary, quote]
                    properties:
                      cell_id: { type: string }
                      row_id: { type: string }
                      column_index: { type: integer, minimum: 0 }
                      summary: { type: string, maxLength: 500 }
                      flag:
                        type: string
                        enum: [green, amber, red, grey]
                      reasoning: { type: string, maxLength: 1000 }
                      quote:
                        type: string
                        maxLength: 500
                        description: Verbatim excerpt from the row document
      responses:
        "200":
          description: Cells written
          content:
            application/json:
              schema:
                type: object
                required: [updated, matrixStatus]
                properties:
                  updated: { type: integer }
                  matrixStatus:
                    type: string
                    enum: [draft, generating, ready]
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List async jobs (newest first)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, done, error]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/Job" }

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Poll an async job
      description: >
        Returns the job's status (`queued|running|done|error`), error, and
        result payload. Jobs are created by long-running ops; they run on the
        org's JobRunner Durable Object, sequentially per org with retries
        (max 3 attempts).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: Job public ID (`job_…`)
      responses:
        "200":
          description: Job state
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    id,
                    type,
                    status,
                    error,
                    result,
                    created_at,
                    started_at,
                    finished_at,
                  ]
                properties:
                  id: { type: string }
                  type: { type: string }
                  status:
                    type: string
                    enum: [queued, running, done, error]
                  error: { type: string, nullable: true }
                  result: { nullable: true }
                  created_at: { type: string, format: date-time }
                  started_at:
                    { type: string, format: date-time, nullable: true }
                  finished_at:
                    { type: string, format: date-time, nullable: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /review-packs:
    get:
      tags: [Revisions]
      operationId: listReviewPacks
      summary: List review packs (builtin + org-authored)
      responses:
        "200":
          description: Packs
          content:
            application/json:
              schema:
                type: object
                properties:
                  packs:
                    type: array
                    items: { $ref: "#/components/schemas/ReviewPack" }
    post:
      tags: [Revisions]
      operationId: createReviewPack
      summary: Create an org-authored review pack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, columns]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                columns:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items: { $ref: "#/components/schemas/ReviewColumn" }
      responses:
        "201":
          description: Pack created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPack" }

  /review-packs/{id}:
    get:
      tags: [Revisions]
      operationId: getReviewPack
      summary: Get a review pack
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pack
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPack" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Revisions]
      operationId: deleteReviewPack
      summary: Delete an org-authored review pack
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /revisions:
    post:
      tags: [Revisions]
      operationId: proposeRevision
      summary: Propose a redline on a draft document
      description: >
        Anchors a verbatim quote from the document text and proposes an
        insert/delete/replace. Auto-attaches `{page, bbox}` when the quote
        resolves against per-word geometry. Status stays `pending` until a
        human or agent accepts/rejects; the source document is never
        mutated — accepting materializes a derived counter-proposal draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, kind, anchor_quote]
              properties:
                document_id: { type: string }
                kind:
                  type: string
                  enum: [insert, delete, replace]
                anchor_quote:
                  type: string
                  description: Verbatim excerpt the edit attaches to
                proposed_text:
                  type: string
                  description: Replacement (replace) or inserted text (insert)
                rationale: { type: string }
                review_cell_id: { type: string }
      responses:
        "201":
          description: Pending revision created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Revisions]
      operationId: listRevisions
      summary: List revision suggestions
      parameters:
        - name: document_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected]
      responses:
        "200":
          description: Revisions
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items: { $ref: "#/components/schemas/Revision" }

  /revisions/accept-all:
    post:
      tags: [Revisions]
      operationId: acceptAllRevisions
      summary: Accept every pending revision on a document
      description: >
        One derived draft carries all pending edits — a single tracked-
        changes .docx when `output=docx`. All accepted revisions point at
        the same `derived_document_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id]
              properties:
                document_id: { type: string }
                output: { type: string, enum: [pdf, docx] }
      responses:
        "200":
          description: Derived document + accept count
          content:
            application/json:
              schema:
                type: object
                properties:
                  derived_document_id: { type: string }
                  accepted: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Nothing pending

  /revisions/{id}/accept:
    post:
      tags: [Revisions]
      operationId: acceptRevision
      summary: Accept a revision — materializes a derived counter-proposal draft
      description: >
        Applies the text edit to the document's parsed content, converts to
        PDF via the convert worker, and creates a new draft linked by
        `parent_document_id`. Re-parses fields/annotations on the derived
        doc. Idempotent-ish: already-resolved revisions return 409.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: output
          in: query
          schema:
            type: string
            enum: [pdf, docx]
            description: >
              `docx` produces a Word tracked-changes file (`w:ins`/`w:del`
              runs, `<w:trackChanges/>` settings) as the derived doc's
              `original` — the counterproposal opens as real redlines in
              Word. The working copy stays a converted PDF.
      responses:
        "200":
          description: Accepted — derived_document_id points to the new draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already resolved

  /revisions/{id}/reject:
    post:
      tags: [Revisions]
      operationId: rejectRevision
      summary: Reject a pending revision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already resolved

  /jobs/{id}/stream:
    get:
      tags: [Jobs]
      operationId: streamJob
      summary: SSE stream of job state
      description: >
        `state` events carry the full job payload on every status change;
        `:hb` comments keep the socket warm; the stream closes on
        `done`/`error` or after ~4.5 minutes (reconnect to resume). Because
        `EventSource` can't set headers, `?access_token=` (MCP or api token)
        is accepted on this path only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: access_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of job state
          content:
            text/event-stream: {}

  /reviews/{id}/stream:
    get:
      tags: [Reviews]
      operationId: streamReviewMatrix
      summary: SSE stream of matrix + cell state
      description: >
        `state` events carry `{id, status, cells[]}` — per-cell
        `{id, row_id, column_index, status, flag, summary}` — on every
        change; closes when the matrix leaves `generating`/`draft`.
        `?access_token=` supported like the jobs stream.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: access_token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream of matrix state
          content:
            text/event-stream: {}

