      tags: [Webhooks]
      operationId: flushWebhookDeliveries
      summary: Drain pending webhook deliveries for this organization (SEA-64)
      description: >
        Processes due pending deliveries for the caller's organization
        (attemptCount budget, nextRetryAt due). Useful after outages or to
        force a catch-up without waiting for the */5 cron.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Drain result
          content:
            application/json:
              schema:
                type: object
                required: [success, processed, succeeded, failed]
                properties:
                  success: { type: boolean }
                  processed: { type: integer }
                  succeeded: { type: integer }
                  failed: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Missing webhooks:write scope or organization

  /webhooks/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List recent webhook delivery attempts
      parameters:
        - name: webhook_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Delivery attempts
          content:
            application/json:
              schema:
                type: array
