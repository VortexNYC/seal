        "400":
          $ref: "#/components/responses/ValidationError"

  # ──────────────────────────────────────────────────────────────────────────
  # Document access + bulk
  # ──────────────────────────────────────────────────────────────────────────

  /documents/access:
    get:
      tags: [Documents]
      operationId: getDocumentAccess
      summary: Get document sharing mode
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Access settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentAccess" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Documents]
      operationId: updateDocumentAccess
      summary: Update document sharing mode
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sharing_mode]
              properties:
                sharing_mode:
                  { $ref: "#/components/schemas/DocumentSharingMode" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /documents/bulk-send:
    post:
      tags: [Documents]
      operationId: bulkSendDocuments
      summary: Send multiple documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
                message: { type: string }
      responses:
        "200":
          description: Bulk summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkOperationSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /documents/bulk-void:
    post:
      tags: [Documents]
      operationId: bulkVoidDocuments
      summary: Void multiple documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, reason]
              properties:
                ids:
                  type: array
                  items: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Bulk summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkOperationSummary" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────────────────────────────────
  # API tokens
  # ──────────────────────────────────────────────────────────────────────────

  /organizations/{organizationSlug}/webhooks:
    get:
      tags: [Webhooks]
      operationId: listOrgWebhooks
      summary: List webhooks for an organization
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Webhook list }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Webhooks]
      operationId: createOrgWebhook
      summary: Create an organization webhook
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url, events]
              properties:
                name: { type: string }
                url: { type: string, format: uri }
                description: { type: string }
                events:
                  type: array
                  items: { type: string }
                  description: Event types — see /webhooks/event-types
      responses:
        "201":
          description: Created — includes the signing secret (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  secret: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "403": { description: Requires admin }

  /organizations/{organizationSlug}/webhooks/event-types:
    get:
      tags: [Webhooks]
      operationId: listOrgWebhookEventTypes
      summary: Supported webhook event types
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Event type catalog }

  /organizations/{organizationSlug}/webhooks/{webhookId}:
    delete:
      tags: [Webhooks]
      operationId: deleteOrgWebhook
      summary: Delete an organization webhook
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
        - name: webhookId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Deleted }
        "404":
          $ref: "#/components/responses/NotFound"

  /organizations/{organizationSlug}/tokens:
    get:
      tags: [Tokens]
      operationId: listApiTokens
      summary: List API tokens for an organization
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tokens (secrets never included)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Tokens]
      operationId: createApiToken
      summary: Create an API token
      description: >
        Returns the full `seal_…` secret once. Store it — it cannot be retrieved again.
        Requires admin/owner (or a token with the `admin` scope).
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { $ref: "#/components/schemas/ApiTokenScope" }
                  minItems: 1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          $ref: "#/components/responses/ValidationError"

  /organizations/{organizationSlug}/tokens/{tokenId}:
    delete:
      tags: [Tokens]
      operationId: revokeApiToken
      summary: Revoke an API token
      parameters:
        - name: organizationSlug
          in: path
          required: true
          schema: { type: string }
        - name: tokenId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
