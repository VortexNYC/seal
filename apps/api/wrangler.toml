name = "seal-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
minify = true
upload_source_maps = true
workers_dev = false
preview_urls = false

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"
EMAIL_FROM = "notifications@seal.nyc"
APP_URL = "http://localhost:3000"
MCP_SIGNING_KEY_ID = "mcp-key-1"

# Secrets are not in this file. Set them via `wrangler secret put` locally or
# through the CI workflow, which uploads them before each production deploy.

[observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[d1_databases]]
binding = "D1"
database_name = "vortex-sign-dev"
database_id = "90ace57d-cbf1-403c-8458-dc3e370e2570"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notifications@seal.nyc"]

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "vortex-sign-dev-documents"

[[services]]
binding = "ANYDOC"
service = "seal-anydoc-worker"

[[services]]
binding = "SEAL_CONVERT_WORKER"
service = "seal-convert-worker"

[triggers]
crons = ["0 9 * * *"]

[env.production]
name = "seal-api"
workers_dev = false
preview_urls = true

[env.production.vars]
BETTER_AUTH_URL = "https://api.seal.nyc"
ALLOWED_ORIGINS = "https://app.seal.nyc"
EMAIL_FROM = "notifications@seal.nyc"
APP_URL = "https://app.seal.nyc"
MCP_SIGNING_KEY_ID = "mcp-key-1"

[env.production.observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[env.production.d1_databases]]
binding = "D1"
database_name = "vortex-sign-global"
database_id = "6a27b4da-e253-4e8a-8092-d2b17d984953"
migrations_dir = "migrations"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notifications@seal.nyc"]

[[env.production.r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "vortex-sign-documents"

[[env.production.services]]
binding = "ANYDOC"
service = "seal-anydoc-worker"

[[env.production.services]]
binding = "SEAL_CONVERT_WORKER"
service = "seal-convert-worker"

[env.production.triggers]
crons = ["0 9 * * *"]

[[env.production.routes]]
pattern = "api.seal.nyc"
custom_domain = true
