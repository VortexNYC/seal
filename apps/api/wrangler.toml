name = "vortex-sign-api"
main = "src/index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:5173"
EMAIL_FROM = "notifications@vortex.nyc"
APP_URL = "http://localhost:3000"
SEAL_MCP_SIGNING_KEY_ID = "seal-mcp-key-1"

# Secrets are not in this file. Set them via `wrangler secret put` locally or
# through the CI workflow, which uploads them before each production deploy.

[ai]
binding = "AI"
remote = true

[[d1_databases]]
binding = "D1"
database_name = "vortex-sign-global"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "vortex-sign-documents"

[[services]]
binding = "ANYDOC"
service = "seal-anydoc-worker"

[[services]]
binding = "SEAL_CONVERT_WORKER"
service = "seal-convert-worker"

[triggers]
crons = ["0 9 * * *"]

[env.production]
name = "vortex-sign-api"

[env.production.vars]
BETTER_AUTH_URL = "https://api.seal.nyc"
ALLOWED_ORIGINS = "https://app.seal.nyc,https://app.vortex.nyc"
EMAIL_FROM = "notifications@vortex.nyc"
APP_URL = "https://app.seal.nyc"
SEAL_MCP_SIGNING_KEY_ID = "seal-mcp-key-1"
