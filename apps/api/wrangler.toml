name = "seal-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]
minify = true
upload_source_maps = true
workers_dev = false
preview_urls = false

[vars]
BETTER_AUTH_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:5180,http://localhost:5173,http://localhost:3000"
EMAIL_FROM = "notifications@seal.nyc"
APP_URL = "http://localhost:5180"
MCP_SIGNING_KEY_ID = "mcp-key-1"

# Secrets are not in this file. Set them via `wrangler secret put` locally or
# through the CI workflow, which uploads them before each production deploy.

[observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[d1_databases]]
binding = "D1"
database_name = "seal-dev"
database_id = "87e149a4-908f-4380-a70f-cc2f02f68a07"
migrations_dir = "migrations"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notifications@seal.nyc"]

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "seal-dev-documents"

[[services]]
binding = "ANYDOC"
service = "seal-anydoc-worker"

[[services]]
binding = "SEAL_CONVERT_WORKER"
service = "seal-convert-worker"

[triggers]
crons = ["0 9 * * *", "*/5 * * * *"]

[env.production]
name = "seal-api"
workers_dev = false
preview_urls = true

[env.production.vars]
BETTER_AUTH_URL = "https://api.seal.nyc"
ALLOWED_ORIGINS = "https://app.seal.nyc"
EMAIL_FROM = "notifications@seal.nyc"
APP_URL = "https://app.seal.nyc"
MCP_SIGNING_KEY_ID = "mcp-key-1"

[env.production.observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[env.production.d1_databases]]
binding = "D1"
database_name = "seal-global"
database_id = "b49f3f65-510b-4b15-849e-8b64258a3d8e"
migrations_dir = "migrations"

[[env.production.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["notifications@seal.nyc"]

[[env.production.r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "seal-documents"

[[env.production.services]]
binding = "ANYDOC"
service = "seal-anydoc-worker"

[[env.production.services]]
binding = "SEAL_CONVERT_WORKER"
service = "seal-convert-worker"

[env.production.triggers]
crons = ["0 9 * * *", "*/5 * * * *"]

[[env.production.routes]]
pattern = "api.seal.nyc"
custom_domain = true

# ── Self-host (your Cloudflare account) ──────────────────────────────────────
# Auto-provisions D1 + R2 on first `wrangler deploy --env selfhost` (wrangler ≥4.45).
# No Vortex resource IDs. No custom domains. workers.dev only.
# Optional Email / anydoc / convert bindings are omitted — PDF upload→sign works
# without them. Add later when you need mail or DOCX conversion.
# Distinct names so a mistaken deploy on the Vortex account cannot clobber
# hosted production (seal-api / seal-global / seal-documents).
[env.selfhost]
name = "seal-selfhost-api"
workers_dev = true
preview_urls = true

[env.selfhost.vars]
# PLACEHOLDERS — bare hosts without an account subdomain. Signing links break if
# these ship. Always deploy via `pnpm selfhost` or
# `pnpm --filter @seal/api run deploy:selfhost` (rewrites to
# seal-selfhost-*.<account>.workers.dev). /health returns 503 if these remain.
BETTER_AUTH_URL = "https://seal-selfhost-api.workers.dev"
ALLOWED_ORIGINS = "https://seal-selfhost-web.workers.dev"
EMAIL_FROM = "noreply@seal.nyc"
APP_URL = "https://seal-selfhost-web.workers.dev"
MCP_SIGNING_KEY_ID = "mcp-key-1"

[env.selfhost.observability]
enabled = true
logs = { enabled = true }

[[env.selfhost.d1_databases]]
binding = "D1"
database_name = "seal-selfhost"
migrations_dir = "migrations"

[[env.selfhost.r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "seal-selfhost-documents"

# Requires the Cloudflare account to have Email Sending enabled for the
# from-domain (e.g. `wrangler email sending enable yourdomain.com`).
# Customers: use your own domain here. Vortex dogfood uses seal.nyc.
[[env.selfhost.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@seal.nyc"]
