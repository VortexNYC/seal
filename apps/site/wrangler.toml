name = "seal-site-dev"
main = "src/worker.ts"
compatibility_date = "2026-09-16"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
workers_dev = false
preview_urls = false

[observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[d1_databases]]
binding = "DB"
database_name = "seal-site-dev"
database_id = "88b401b2-2c69-4480-9180-4ecf10c74df4"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "seal-site-media-dev"

[[kv_namespaces]]
binding = "CACHE"
id = "6bc75c33ad8c4abcb60f1a0e8bd2564d"

[[worker_loaders]]
binding = "LOADER"

[triggers]
# No cron: EmDash scheduled tasks only matter once the CMS holds content
# (0 posts/pages/tasks today). Re-add an hourly cron if scheduled
# publishing or plugin housekeeping becomes real.

[env.production]
name = "seal-site"
workers_dev = false
preview_urls = true

[env.production.observability]
enabled = true
logs = { enabled = true }
traces = { enabled = true, head_sampling_rate = 0.1 }

[[env.production.d1_databases]]
binding = "DB"
database_name = "seal-site"
database_id = "82584b38-1db3-43b7-b174-1419e1cc951c"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "seal-site-media"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "f0b658f9f10446bb853034c6a8c3324f"

[[env.production.worker_loaders]]
binding = "LOADER"

[env.production.triggers]
# See base [triggers] — no scheduled work exists yet.

[[env.production.routes]]
pattern = "seal.nyc"
custom_domain = true

[[env.production.routes]]
pattern = "www.seal.nyc"
custom_domain = true
