<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Seal - Document Signatures</title>
    <meta name="title" content="Seal - Document Signatures" />
    <meta
      name="description"
      content="Seal - Modern document signature and workflow management. Sign, send, and manage documents securely."
    />
    <meta
      name="keywords"
      content="document signing, e-signature, digital signatures, document management, workflow, contracts"
    />
    <meta name="author" content="Seal" />
    <meta name="theme-color" content="#0d9488" />

    <!-- SEO: Allow AI crawlers to process this page -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-iphone.png" />
    <link rel="apple-touch-icon" sizes="196x196" href="/favicon/favicon-android.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Seal" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:title" content="Seal - Document Signatures" />
    <meta
      property="og:description"
      content="Seal - Modern document signature and workflow management. Sign, send, and manage documents securely."
    />
    <meta property="og:image" content="%VITE_APP_URL%/favicon/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Seal Logo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@sealhq" />
    <meta name="twitter:title" content="Seal - Document Signatures" />
    <meta
      name="twitter:description"
      content="Seal - Modern document signature and workflow management. Sign, send, and manage documents securely."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/favicon/og-image.png" />
    <meta name="twitter:image:alt" content="Seal Logo" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://clerk.com" />
    <link rel="dns-prefetch" href="https://us.i.posthog.com" />

    <!-- Jam.dev bug reporting -->
    <meta name="jam:team" content="%VITE_JAM_TEAM_ID%" />
    <script type="module" src="https://js.jam.dev/capture.js"></script>
    <script type="module" src="https://js.jam.dev/recorder.js"></script>

    <!-- Preload critical logo for LCP optimization -->
    <link
      rel="preload"
      as="image"
      href="/logo/seal-logo-color-no-background.svg"
      type="image/svg+xml"
    />

    <!-- Google Fonts for signature styling (swap display for better CLS) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Pacifico&family=Sacramento&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
