# Generated by @vortexnyc/tooling vortex-project-kit. Edit vortex.project.json, not this file.
# Two-tier local gate.
#   pre-commit — staged files only, fast enough to never think about.
#   pre-push   — the proof wall.
#
# vp staged reads the shared type-aware lint and format policy from vite.config.ts.
#

pre-commit:
  # NOT parallel. `vp staged` stashes the worktree down to HEAD while it runs its
  # fixers, so a concurrent job lints that stashed snapshot rather than the staged
  # content. For convex-tier that inverts the gate: a commit whose whole purpose is
  # FIXING convex findings gets blocked by the very findings it removes, reported
  # against the pre-fix HEAD. Observed in vortex-payments: the hook reported 3
  # .collect() and 4 untyped db.patch in a file whose working-tree copy had zero.
  parallel: false
  jobs:
    - name: vite-plus-staged
      run: pnpm exec vp staged

    - name: convex-tier
      run: pnpm run lint:convex
      glob:
        - "convex/**/*.ts"
        - "apps/*/convex/**/*.ts"
        - "packages/convex/**/*.ts"


pre-push:
  jobs:
    - name: proof-wall
      run: pnpm run prepush:check
