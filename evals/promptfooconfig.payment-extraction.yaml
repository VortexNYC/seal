description: Seal AI — Payment Extraction Accuracy (ground-truth corpus)
providers:
- id: file://provider-extraction.mjs
  label: Seal Extraction
prompts:
- '{{prompt}}'
defaultTest:
  options:
    timeout: 60000
tests:
- vars:
    prompt: 01-saas-subscription
  assert:
  - type: javascript
    value: JSON.parse(output).paymentType === "recurring"
  - type: javascript
    value: JSON.parse(output).currency === "usd"
  - type: javascript
    value: JSON.parse(output).dueDateTerms === "net_30"
  - type: javascript
    value: JSON.parse(output).lineItems?.length === 2
  - type: javascript
    value: Math.abs((JSON.parse(output).lineItems?.[0]?.unitPriceCents ?? 0) - 850000) <= 17000
  - type: javascript
    value: JSON.parse(output).lineItems?.[0]?.quantity === 1
  - type: javascript
    value: Math.abs((JSON.parse(output).lineItems?.[1]?.unitPriceCents ?? 0) - 200000) <= 4000
  - type: javascript
    value: JSON.parse(output).lineItems?.[1]?.quantity === 1
  - type: javascript
    value: '!!JSON.parse(output).lateFee === true'
  - type: javascript
    value: JSON.parse(output).lateFee?.type === "percentage"
  - type: javascript
    value: Math.abs((JSON.parse(output).lateFee?.amount ?? 0) - 1.5) < 0.01
  - type: javascript
    value: JSON.parse(output).lateFee?.gracePeriodDays === 5
  - type: javascript
    value: JSON.parse(output).recurringConfig?.interval === "month"
  - type: javascript
    value: JSON.parse(output).recurringConfig?.intervalCount === 1
  description: 01-saas-subscription
