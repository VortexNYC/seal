name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# @plasmapos/vortex-auth is published to GitHub Packages; bun install reads this
# via .npmrc (//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}). Mirrors crm CI.
#
# Fast, deterministic checks run on EVERY PR (staging + main). The heavy browser
# E2E suite (smoke/chromium/landing) lives in e2e.yml and gates PRODUCTION (main)
# only — it is NOT run on staging PRs (split out 2026-06-22: full E2E on every
# staging PR was the dominant CI cost/time/flake sink).
env:
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  quality:
    name: Quality Checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun --bun run verify

  test-backend:
    name: Backend Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend tests
        run: cd apps/backend && bun --bun run test

  test-frontend:
    name: Frontend Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        # Avoid `bun --bun run` here as well: the React/Vitest suite can hit
        # invalid-hook-call failures under Bun's Node shim on GitHub runners,
        # while the normal workspace script execution is stable.
        run: cd apps/web && bun run test
