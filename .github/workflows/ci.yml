name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: quality
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@d5616419e3a9637febec6da1475cee9d07a317fd # v1.20.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: "@vortexnyc"
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check
        run: vp run check

      - name: Knip
        run: vp run knip
