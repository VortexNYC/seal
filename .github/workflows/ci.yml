name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Avoid `bun --bun run` here: forcing scripts through Bun's Node shim makes
      # workspace `oxfmt --check` fail with DataCloneError, while the normal
      # root verification command passes locally and in CI.
      - name: Static analysis
        run: bun run static-analysis

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend tests
        run: cd apps/backend && bun --bun run test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        run: cd apps/web && bun --bun run test

  test-landing-e2e:
    name: Landing E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/landing && bunx playwright install --with-deps chromium firefox webkit

      - name: Run landing E2E tests
        # Avoid `bun --bun run` here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/landing && bun run test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test-backend, test-frontend, test-landing-e2e]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all workspaces
        # Avoid `bun --bun run` here as well: routing scripts through Bun's Node
        # shim has caused workspace build issues, while the normal root build
        # command succeeds locally and in CI.
        run: bun run build
        env:
          VITE_CONVEX_URL: "https://placeholder.convex.cloud"
          VITE_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_ENVIRONMENT: "production"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "plasma-vh"
          SENTRY_PROJECT: "seal"
