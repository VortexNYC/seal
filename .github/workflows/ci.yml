name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# @plasmapos/vortex-auth is published to GitHub Packages; bun install reads this
# via .npmrc (//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}). Mirrors crm CI.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun --bun run verify

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run backend tests
        run: cd apps/backend && bun --bun run test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend tests
        # Avoid `bun --bun run` here as well: the React/Vitest suite can hit
        # invalid-hook-call failures under Bun's Node shim on GitHub runners,
        # while the normal workspace script execution is stable.
        run: cd apps/web && bun run test

  test-web-e2e-smoke:
    name: Web E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run web E2E smoke gate
        id: web_e2e_smoke
        # Fail fast on environment/auth/helper regressions before the full suite.
        # Avoid `bun --bun run` here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/web && bun run test:e2e --project=smoke-contract
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          SEAL_BILLING_E2E_EXPECTED_PROVIDER: stripe
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E smoke artifacts
        if: steps.web_e2e_smoke.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-web-e2e-chromium:
    name: Web E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - quality
      - test-web-e2e-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run web E2E chromium suite
        id: web_e2e_chromium
        # Smoke passed in the upstream job, but this job runs on a fresh machine.
        # Re-run setup dependencies here so Chromium has its own local setup artifacts.
        run: cd apps/web && bun run test:e2e --project=chromium
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          SEAL_BILLING_E2E_EXPECTED_PROVIDER: stripe
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E chromium artifacts
        if: steps.web_e2e_chromium.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-chromium-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-landing-e2e:
    name: Landing E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Vortex Payments
        uses: actions/checkout@v4
        with:
          repository: shlomokabareti/vortex-payments
          ref: main
          path: vortex-payments
          token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Link Vortex Payments package path
        run: ln -sfn "$GITHUB_WORKSPACE/vortex-payments" "$GITHUB_WORKSPACE/../vortex-payments"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/landing && bunx playwright install --with-deps chromium firefox webkit

      - name: Run landing E2E tests
        # Avoid `bun --bun run` here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/landing && bun run test:e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
