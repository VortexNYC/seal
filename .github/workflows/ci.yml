name: CI

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type production to run release-only E2E"
        required: true
        type: string
  release:
    types: [published]
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# @plasmapos/vortex-auth is published to GitHub Packages; pnpm install reads this
# via .npmrc (//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}). Mirrors crm CI.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubicloud-standard-4
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (clean-machine)
        # PR/CI runs the clean-machine-safe gate only: lint, format, typecheck, knip,
        # and the static retired-provider residue proof. The full `verify` additionally
        # runs `verify:seal-vortex-migration`, whose launch/production-readiness and
        # `-live` proofs require Vortex Billing prod secrets that are intentionally NOT
        # in CI. Per Seal's doctrine, that launch/live proof is a local/operator and
        # release-time gate, not a per-PR gate. Run `pnpm run verify` locally / at release.
        run: pnpm run verify:clean

  test-backend:
    name: Backend Tests
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend tests
        run: cd apps/backend && pnpm run test

  test-frontend:
    name: Frontend Tests
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        # Avoid forcing a special runtime here as well: the React/Vitest suite can hit
        # invalid-hook-call failures under Bun's Node shim on GitHub runners,
        # while the normal workspace script execution is stable.
        run: cd apps/web && pnpm run test

  test-web-e2e-smoke:
    name: Web E2E Smoke
    if: github.event_name == 'release' || inputs.confirm_production == 'production'
    runs-on: ubicloud-standard-4
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run web E2E smoke gate
        id: web_e2e_smoke
        # Fail fast on environment/auth/helper regressions before the full suite.
        # Avoid forcing a special runtime here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/web && pnpm run test:e2e --project=smoke-contract
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E smoke artifacts
        if: steps.web_e2e_smoke.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-web-e2e-chromium:
    name: Web E2E Chromium
    if: github.event_name == 'release' || inputs.confirm_production == 'production'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    needs:
      - quality
      - test-web-e2e-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && pnpm exec playwright install --with-deps chromium

      - name: Run web E2E chromium suite
        id: web_e2e_chromium
        # Smoke passed in the upstream job, but this job runs on a fresh machine.
        # Re-run setup dependencies here so Chromium has its own local setup artifacts.
        run: cd apps/web && pnpm run test:e2e --project=chromium
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E chromium artifacts
        if: steps.web_e2e_chromium.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-chromium-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-landing-e2e:
    name: Landing E2E
    if: github.event_name == 'release' || inputs.confirm_production == 'production'
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers for PR gate
        if: github.event_name == 'pull_request'
        run: cd apps/landing && pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browsers for full gate
        if: github.event_name != 'pull_request'
        run: cd apps/landing && pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run landing E2E PR gate
        if: github.event_name == 'pull_request'
        # PRs need a fast representative landing gate. Full cross-browser landing
        # coverage still runs on push/manual workflow runs.
        run: cd apps/landing && pnpm run test:e2e --project=chromium --project="Mobile Chrome"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run landing E2E full gate
        if: github.event_name != 'pull_request'
        # Avoid forcing a special runtime here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/landing && pnpm run test:e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
