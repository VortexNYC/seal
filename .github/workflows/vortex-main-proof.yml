# Generated by @vortexnyc/tooling vortex-project-kit. Edit vortex.project.json, not this file.
name: Vortex Proof

# The full proof wall validates the exact pull-request SHA before it reaches the
# Graphite merge queue. Graphite fast-forwards that already-proved SHA into the
# base branch, so rerunning the same wall after merge only adds cost and noise.
on:
  pull_request:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  wall:
    name: wall
    runs-on: ubicloud-standard-4
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 11 ignores ${NODE_AUTH_TOKEN} in a committed .npmrc and 401s. The
          # credential must be set at the user level instead. Without this step the
          # workflow LOOKS correct — the env var is set, the registry is mapped — and
          # every @vortexnyc/* fetch fails with what reads as a bad token. That is
          # exactly how veil burned four tokens.
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Vite+ stores task artifacts under node_modules, so restore only after
      # pnpm has created the dependency tree. Ubicloud transparently serves the
      # standard Actions cache from its runner-local cache plane.
      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate generated control plane
        shell: bash
        run: |
          node node_modules/@vortexnyc/tooling/dist/bin/vortex-project-kit.js --check --root .
          node node_modules/@vortexnyc/tooling/dist/bin/vortex-project-kit.js doctor --root .

      - name: Full proof wall
        shell: bash
        run: pnpm run prepush:check

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
