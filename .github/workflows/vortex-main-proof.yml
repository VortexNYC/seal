# Generated by @vortexnyc/tooling vortex-project-kit. Edit vortex.project.json, not this file.
name: Main Proof

# The full proof wall, post-merge. PR CI is a <60s control-plane receipt; the heavy wall runs
# locally on every pre-push and here on every push to the base branch — a red on this workflow
# means a hook was skipped or the clean machine disagrees with the dev machine, and it pages
# without ever blocking PR iteration.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  proof:
    name: proof
    runs-on: [self-hosted, vortex, linux, x64, vortex-heavy]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
            .vite/task-cache
          key: vortex-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            vortex-ci-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vortex-ci-${{ runner.os }}-

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 11 ignores ${NODE_AUTH_TOKEN} in a committed .npmrc and 401s. The
          # credential must be set at the user level instead. Without this step the
          # workflow LOOKS correct — the env var is set, the registry is mapped — and
          # every @vortexnyc/* fetch fails with what reads as a bad token. That is
          # exactly how veil burned four tokens.
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated control plane
        shell: bash
        run: |
          node node_modules/@vortexnyc/tooling/dist/bin/vortex-project-kit.js --check --root .
          node node_modules/@vortexnyc/tooling/dist/bin/vortex-project-kit.js doctor --root .

      - name: Full proof wall
        shell: bash
        run: pnpm run prepush:check
