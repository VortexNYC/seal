name: Secrets

# Manual-only. cloudflare-ci owns migrate+deploy; this exists because there is
# not yet a secrets upload/verify path in cloudflare-ci. Do not add deploy steps
# here — keep this workflow secrets-only.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  secrets:
    name: Upload + verify API secrets
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || secrets.SEAL_INTERNAL_API_KEY }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.SEAL_BETTER_AUTH_SECRET }}
      TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET || secrets.SEAL_TOKEN_HASH_SECRET }}
      MCP_SIGNING_KEY: ${{ secrets.MCP_SIGNING_KEY || secrets.SEAL_MCP_SIGNING_KEY }}
      SEAL_SEALING_P12: ${{ secrets.SEAL_SEALING_P12 }}
      SEAL_SEALING_P12_PASSPHRASE: ${{ secrets.SEAL_SEALING_P12_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Fail closed without Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

      - name: Upload API secrets
        working-directory: apps/api
        run: |
          set -euo pipefail
          for var in INTERNAL_API_KEY BETTER_AUTH_SECRET TOKEN_HASH_SECRET MCP_SIGNING_KEY; do
            if [ -z "${!var}" ]; then
              echo "$var is not set."
              exit 1
            fi
            printf '%s' "${!var}" | vp exec wrangler secret put "$var" --env production
          done
          # Optional SEA-49 L1b platform seal — upload when present; do not fail closed.
          if [ -n "${SEAL_SEALING_P12:-}" ] && [ -n "${SEAL_SEALING_P12_PASSPHRASE:-}" ]; then
            printf '%s' "$SEAL_SEALING_P12" | vp exec wrangler secret put SEAL_SEALING_P12 --env production
            printf '%s' "$SEAL_SEALING_P12_PASSPHRASE" | vp exec wrangler secret put SEAL_SEALING_P12_PASSPHRASE --env production
            echo "Uploaded SEAL_SEALING_P12 + passphrase."
          else
            echo "SEAL_SEALING_P12 secrets not set — skipping platform seal upload."
          fi

      - name: Verify secrets are bound
        working-directory: apps/api
        run: |
          set -euo pipefail
          SECRETS_JSON=$(vp exec wrangler secret list --env production --format json)
          for var in INTERNAL_API_KEY BETTER_AUTH_SECRET TOKEN_HASH_SECRET MCP_SIGNING_KEY; do
            if ! printf '%s' "$SECRETS_JSON" | grep -q "\"$var\""; then
              echo "::error::$var missing from seal-api after upload"
              exit 1
            fi
          done
          echo "Required production secrets verified on seal-api."
          if [ -n "${SEAL_SEALING_P12:-}" ]; then
            for var in SEAL_SEALING_P12 SEAL_SEALING_P12_PASSPHRASE; do
              if ! printf '%s' "$SECRETS_JSON" | grep -q "\"$var\""; then
                echo "::error::$var missing from seal-api after upload"
                exit 1
              fi
            done
            echo "Platform seal secrets verified."
          fi
