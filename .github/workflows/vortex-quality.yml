# Generated by @vortexnyc/tooling vortex-project-kit. Edit vortex.project.json, not this file.
name: Vortex Quality

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
  CONVEX_OVERRIDE_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
  CONVEX_DEPLOYMENT: "dev:aware-buzzard-568"
  VITE_CONVEX_URL: "https://aware-buzzard-568.convex.cloud"
  CONVEX_URL: "https://aware-buzzard-568.convex.cloud"
  VITE_BETTER_AUTH_URL: "https://aware-buzzard-568.convex.site/api/auth"
  CONVEX_SITE_URL: "https://aware-buzzard-568.convex.site"
  BETTER_AUTH_URL: "https://aware-buzzard-568.convex.site/api/auth"
  PLAYWRIGHT_TEST_BASE_URL: "http://localhost:5180"
  BETTER_AUTH_TRUSTED_ORIGINS: "http://localhost:5180,http://seal.localhost:1355,https://staging-app.seal.nyc,https://app.seal.nyc"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vortex lean quality receipt
        shell: bash
        run: |
          bun run precommit:install
          bun run project-kit:check
          bun run project-kit:doctor
          bun run precommit:check

          base_ref=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          fi

          changed_files=""
          if [ -n "$base_ref" ]; then
            changed_files="$(git diff --name-only "$base_ref"...HEAD || git diff --name-only "$base_ref" HEAD || true)"
          fi
          if [ -z "$changed_files" ]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          runtime_changed="$(printf '%s\n' "$changed_files" | grep -Ev '^(docs/|.*[.]md$|[.]github/|[.]githooks/|AGENTS[.]md$|CLAUDE[.]md$|LLM-INTEGRATION[.]md$)' || true)"
          if [ -n "$runtime_changed" ]; then
            echo "Runtime/package surface changed; local pre-push must have run the heavy wall."
            echo "CI receipt is intentionally no-build: it verifies clean-machine control-plane drift only."
            printf '%s\n' "$runtime_changed"
          else
            echo "Docs/process-only change; clean-machine control-plane receipt complete."
          fi

  manual_verification:
    name: manual_verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Manual verification wall
        shell: bash
        run: |
          bun run prepush:check
