# Generated by @plasmapos/tooling vortex-project-kit. Edit vortex.project.json, not this file.
name: Vortex Quality

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONVEX_OVERRIDE_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: CI preinstall
        shell: bash
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vortex proof wall
        shell: bash
        run: |
          bun run project-kit:check
          bun run project-kit:doctor
          bun run migrate:legacy-auth-package:check
          bun run convex:insights
          bun run typecheck
          bun run lint
          bun run format:changed:check
          bun run check:preferred-stack
          bun run build
          bun run test
          bun run auth:check
          bun run auth:preflight
