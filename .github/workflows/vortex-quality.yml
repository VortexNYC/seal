# Generated by @vortexnyc/tooling vortex-project-kit. Edit vortex.project.json, not this file.
name: Vortex Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The built-in GITHUB_TOKEN reads the private @vortexnyc/* packages. Each package grants
# Actions access to the consumer repos, which is the documented GitHub Packages path — no PAT
# to mint, copy into every repo, or silently expire. A repo-level secret also shadows an org
# one, which is how veil ended up authenticating with a dead token nobody could see.
permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CONVEX_OVERRIDE_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
  CONVEX_DEPLOYMENT: "dev:aware-buzzard-568"
  VITE_CONVEX_URL: "https://aware-buzzard-568.convex.cloud"
  CONVEX_URL: "https://aware-buzzard-568.convex.cloud"
  VITE_BETTER_AUTH_URL: "https://aware-buzzard-568.convex.site/api/auth"
  CONVEX_SITE_URL: "https://aware-buzzard-568.convex.site"
  BETTER_AUTH_URL: "https://aware-buzzard-568.convex.site/api/auth"
  PLAYWRIGHT_TEST_BASE_URL: "http://localhost:5180"
  BETTER_AUTH_TRUSTED_ORIGINS: "http://localhost:5180,http://seal.localhost:1355,https://staging-app.seal.nyc,https://app.seal.nyc"

jobs:
  quality:
    name: quality
    runs-on: ubicloud-standard-2
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # REQUIRED even though this job runs no install: the receipt fetches
          # @vortexnyc/tooling with pnpm dlx, and that package is private. pnpm 11 refuses
          # to expand ${NODE_AUTH_TOKEN} from a committed .npmrc (see .npmrc), so the
          # credential must be set at the user level or every fetch 401s.
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Clean-machine control-plane receipt (no app install)
        shell: bash
        run: |
          # The receipt verifies generated-file drift, doctor conformance, and hook wiring.
          # None of that needs the app dependency tree. The heavy wall (typecheck/build/test)
          # runs locally on every pre-push and in Vortex Proof on the exact PR SHA.
          pnpm --package="@vortexnyc/tooling@0.11.23" dlx vortex-project-kit --check --root .
          pnpm --package="@vortexnyc/tooling@0.11.23" dlx vortex-project-kit doctor --root .

  manual_verification:
    name: manual_verification
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubicloud-standard-4
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Authenticate to GitHub Packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pnpm 11 ignores ${NODE_AUTH_TOKEN} in a committed .npmrc and 401s. The
          # credential must be set at the user level instead. Without this step the
          # workflow LOOKS correct — the env var is set, the registry is mapped — and
          # every @vortexnyc/* fetch fails with what reads as a bad token. That is
          # exactly how veil burned four tokens.
          pnpm config set "//npm.pkg.github.com/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Manual verification wall
        shell: bash
        run: |
          pnpm run prepush:check

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
