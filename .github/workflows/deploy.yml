name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read
  actions: write

jobs:
  migrate:
    name: Apply D1 migrations
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  deploy:
    name: deploy
    needs: [migrate]
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 30
    environment: production
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: "https://api.seal.nyc"
      VITE_BETTER_AUTH_URL: "https://api.seal.nyc"
      VITE_APP_URL: "https://app.seal.nyc"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@d5616419e3a9637febec6da1475cee9d07a317fd # v1.20.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: "@vortexnyc"
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Fail closed without Cloudflare credentials
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set."
            exit 1
          fi

      - name: Upload API secrets
        working-directory: apps/api
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || secrets.SEAL_INTERNAL_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.SEAL_BETTER_AUTH_SECRET }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET || secrets.SEAL_TOKEN_HASH_SECRET }}
          MCP_SIGNING_KEY: ${{ secrets.MCP_SIGNING_KEY || secrets.SEAL_MCP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          for var in INTERNAL_API_KEY BETTER_AUTH_SECRET TOKEN_HASH_SECRET MCP_SIGNING_KEY; do
            if [ -z "${!var}" ]; then
              echo "$var is not set."
              exit 1
            fi
          done
          printf '%s' "$INTERNAL_API_KEY" | vp exec wrangler secret put INTERNAL_API_KEY --env production
          printf '%s' "$BETTER_AUTH_SECRET" | vp exec wrangler secret put BETTER_AUTH_SECRET --env production
          printf '%s' "$TOKEN_HASH_SECRET" | vp exec wrangler secret put TOKEN_HASH_SECRET --env production
          printf '%s' "$MCP_SIGNING_KEY" | vp exec wrangler secret put MCP_SIGNING_KEY --env production

      - name: Deploy
        run: vp run deploy

      - name: Record release evidence
        if: always()
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > release-record.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref_name }}",
            "timestamp": "$TIMESTAMP",
            "ci_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "apps": ["anydoc-worker", "convert-worker", "api", "mcp-worker", "web"]
          }
          EOF

      - name: Upload release record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-record-${{ github.sha }}
          path: release-record.json
          if-no-files-found: error
          retention-days: 90
