name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ vars.BETTER_AUTH_URL || vars.SEAL_BETTER_AUTH_URL }}
      VITE_BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || vars.SEAL_BETTER_AUTH_URL }}
      VITE_APP_URL: ${{ vars.APP_URL || vars.SEAL_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: "@vortexnyc"
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Upload API secrets
        working-directory: apps/api
        env:
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY || secrets.SEAL_INTERNAL_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || secrets.SEAL_BETTER_AUTH_SECRET }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET || secrets.SEAL_TOKEN_HASH_SECRET }}
          SEAL_MCP_SIGNING_KEY: ${{ secrets.SEAL_MCP_SIGNING_KEY }}
        run: |
          printf '%s' "$INTERNAL_API_KEY" | pnpm exec wrangler secret put INTERNAL_API_KEY --env production
          printf '%s' "$BETTER_AUTH_SECRET" | pnpm exec wrangler secret put BETTER_AUTH_SECRET --env production
          printf '%s' "$TOKEN_HASH_SECRET" | pnpm exec wrangler secret put TOKEN_HASH_SECRET --env production
          printf '%s' "$SEAL_MCP_SIGNING_KEY" | pnpm exec wrangler secret put SEAL_MCP_SIGNING_KEY --env production

      - name: Deploy
        run: pnpm run deploy
