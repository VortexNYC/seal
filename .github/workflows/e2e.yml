name: E2E

# Heavy browser-E2E suite — gates PRODUCTION (main), NOT the staging integration
# branch. Split out of ci.yml on 2026-06-22: running full Playwright E2E on every
# staging PR was the dominant CI cost/time/flake sink (8-min Chromium + Landing on
# changes that can't affect them). Staging PRs now run only the fast checks in
# ci.yml; the full E2E runs on PRs into main and on push to main (the prod frontline).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# @plasmapos/vortex-auth is published to GitHub Packages; bun install reads this
# via .npmrc (//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}).
env:
  NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

jobs:
  test-web-e2e-smoke:
    name: Web E2E Smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run web E2E smoke gate
        id: web_e2e_smoke
        # Fail fast on environment/auth/helper regressions before the full suite.
        # Avoid `bun --bun run` here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/web && bun run test:e2e --project=smoke-contract
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E smoke artifacts
        if: steps.web_e2e_smoke.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-smoke-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-web-e2e-chromium:
    name: Web E2E Chromium
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    needs:
      - test-web-e2e-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd apps/web && bunx playwright install --with-deps chromium

      - name: Run web E2E chromium suite
        id: web_e2e_chromium
        # Smoke passed in the upstream job, but this job runs on a fresh machine.
        # Re-run setup dependencies here so Chromium has its own local setup artifacts.
        run: cd apps/web && bun run test:e2e --project=chromium
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL_TEST }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL_TEST }}
          VITE_APP_URL: http://localhost:5180
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload web E2E chromium artifacts
        if: steps.web_e2e_chromium.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-chromium-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  test-landing-e2e:
    name: Landing E2E
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clone Vortex sibling repos (file dependencies)
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/PlasmaPOS/vortex-core.git" "$GITHUB_WORKSPACE/../vortex-core"
          git clone --depth 1 "https://x-access-token:${{ secrets.GH_PACKAGES_TOKEN }}@github.com/shlomokabareti/vortex-payments.git" "$GITHUB_WORKSPACE/../vortex-payments"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Vortex Core file package
        run: cd "$GITHUB_WORKSPACE/../vortex-core" && bun install --frozen-lockfile && cd packages/vortex-auth && bun run build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers for PR gate
        if: github.event_name == 'pull_request'
        run: cd apps/landing && bunx playwright install --with-deps chromium

      - name: Install Playwright browsers for full gate
        if: github.event_name != 'pull_request'
        run: cd apps/landing && bunx playwright install --with-deps chromium firefox webkit

      - name: Run landing E2E PR gate
        if: github.event_name == 'pull_request'
        # PRs into main need a fast representative landing gate. Full cross-browser
        # landing coverage still runs on push to main / manual workflow runs.
        run: cd apps/landing && bun run test:e2e --project=chromium --project="Mobile Chrome"
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run landing E2E full gate
        if: github.event_name != 'pull_request'
        # Avoid `bun --bun run` here: Playwright's config loader fails under
        # Bun's Node shim, while the normal workspace script execution works
        # locally and in CI-compatible environments.
        run: cd apps/landing && bun run test:e2e
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
